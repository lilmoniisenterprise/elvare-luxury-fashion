# Temporary helper (photo-work branch only): searches/downloads free-licence Unsplash photos for review.
name: Photo candidates
on:
  push:
    branches: [photo-work]
    paths: ["photo-work/queries.txt", "photo-work/picks.txt", "photo-work/search.py"]
  workflow_dispatch:
permissions:
  contents: write
concurrency: photo-work
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install -q pillow
      - run: python3 photo-work/search.py search
      - run: python3 photo-work/search.py fetch
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898699+github-actions[bot]@users.noreply.github.com"
          git add photo-work
          git commit -qm "Photo candidates" || echo nothing
          git push
